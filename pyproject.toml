[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lucid-dream-racer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "torch>=2.2", "gymnasium[box2d]>=1.0", "pillow>=10",
  "cma>=3.3", "matplotlib>=3.8", "pandas>=2.0", "tqdm>=4.66",
]

[project.optional-dependencies]
app = ["gradio>=4.44", "pygame-ce>=2.4"]
baseline = ["stable-baselines3>=2.4"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["ldr*"]

[tool.ruff]
line-length = 100
